name: Daily update
on:
  schedule:
    - cron: '0 10 * * *'   # ~5:00 AM ET (GitHub may run it late; late beats never)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh data, run simulations, rebuild site
        run: |
          python refresh.py
          cp site/index.html index.html
      - name: Commit and publish
        run: |
          git config user.name "record-book-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily auto-update $(date -u +%F)"
          git push
