name: Daily update
on:
  schedule:
    # odd minutes on purpose: GitHub's scheduler is most congested at :00
    - cron: '23 10 * * *'              # daily full update, ~5:23 AM ET
    - cron: '23 0,4,8,12,16,20 * * *'  # every 4 hours; commits only when something changed
    # live-odds gate: fires every 5 min through the NFL's possible game hours
    # (every day — holiday games float), then checks the real schedule and
    # exits in seconds unless a game is live, a rostered player's injury
    # status changed, or it's a half-hourly news tick
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 0-5,13-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'manual = always run and publish; live = run only when the gate says so'
        required: false
        default: 'manual'
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
env:
  GATE_CRON: '3,8,13,18,23,28,33,38,43,48,53,58 0-5,13-23 * * *'
  INTERIM_CRON: '23 0,4,8,12,16,20 * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate - live game, injury change, or news tick?
        id: live
        if: (github.event_name == 'schedule' && github.event.schedule == env.GATE_CRON) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        run: |
          curl -sL https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv -o /tmp/games.csv
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York")).replace(tzinfo=None)
          season = now.year if now.month >= 8 else now.year - 1
          live = False
          with open("/tmp/games.csv", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r["season"] != str(season) or not r.get("gameday"):
                      continue
                  try:
                      ko = datetime.strptime(r["gameday"] + " " + (r.get("gametime") or "13:00"), "%Y-%m-%d %H:%M")
                  except ValueError:
                      continue
                  if ko - timedelta(minutes=10) <= now <= ko + timedelta(hours=4, minutes=30):
                      live = True
                      break
          # no game on: every tick still checks the news feeds (the news-only
          # run commits data/feeds.json only when a headline actually changed)
          news = not live
          # did a rostered player's injury status change since the last full run?
          inj_changed = False
          if not live:
              try:
                  snap = json.load(open("data/injury_snapshot.json", encoding="utf-8"))
                  req = urllib.request.Request(
                      "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries",
                      headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      d = json.load(r)
                  names = set(snap.get("names", []))
                  cur = {}
                  for t in d.get("injuries", []):
                      for i in t.get("injuries", []):
                          nm = "".join(ch for ch in ((i.get("athlete") or {}).get("displayName") or "").lower()
                                       if ch.isalpha())
                          if nm in names:
                              cur[nm] = i.get("status") or ""
                  inj_changed = cur != snap.get("statuses", {})
              except Exception as e:
                  print("injury check skipped:", e)
          print(f"live={'true' if live else 'false'}")
          print(f"news={'true' if news else 'false'}")
          print(f"injuries={'true' if inj_changed else 'false'}")
          EOF
      - uses: actions/setup-python@v5
        if: steps.live.outcome == 'skipped' || steps.live.outputs.live == 'true' || steps.live.outputs.news == 'true' || steps.live.outputs.injuries == 'true'
        with:
          python-version: '3.12'
      - name: Refresh data, run simulations, rebuild site
        if: steps.live.outcome == 'skipped' || steps.live.outputs.live == 'true' || steps.live.outputs.injuries == 'true'
        run: |
          python refresh.py
          cp site/index.html index.html
      - name: Refresh headlines only
        if: steps.live.outputs.news == 'true' && steps.live.outputs.injuries != 'true'
        run: python refresh.py --news-only
      - name: Commit and publish
        if: steps.live.outcome == 'skipped' || steps.live.outputs.live == 'true' || steps.live.outputs.news == 'true' || steps.live.outputs.injuries == 'true'
        run: |
          git config user.name "record-book-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          # Non-daily runs: skip the commit when only the build timestamp moved.
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "23 10 * * *" ]; } || [ "${{ inputs.mode }}" = "live" ]; then
            if [ "$(git diff --cached --name-only)" = "index.html" ]; then
              strip_ts() { sed -E 's/"built_ts": "[^"]*"/TS/; s/"built": "[^"]*"/B/'; }
              if diff <(git show HEAD:index.html | strip_ts) <(strip_ts < index.html) > /dev/null; then
                echo "only the build timestamp changed - skipping commit"; exit 0
              fi
            fi
            if [ "${{ github.event.schedule }}" = "${{ env.INTERIM_CRON }}" ]; then
              MSG="Interim update $(date -u +%FT%H:%MZ)"
            elif [ "${{ steps.live.outputs.injuries }}" = "true" ]; then
              MSG="Injury update $(date -u +%FT%H:%MZ)"
            elif [ "${{ steps.live.outputs.news }}" = "true" ]; then
              MSG="News update $(date -u +%FT%H:%MZ)"
            else
              MSG="Live odds update $(date -u +%FT%H:%MZ)"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="Manual update $(date -u +%FT%H:%MZ)"
          else
            MSG="Daily auto-update $(date -u +%F)"
          fi
          git commit -m "$MSG"
          git pull --rebase
          git push
