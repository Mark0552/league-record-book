name: Daily update
on:
  schedule:
    - cron: '0 10 * * *'        # daily full update, ~5:00 AM ET (GitHub may run it late)
    # live odds during NFL game windows (UTC, padded an hour for DST):
    - cron: '*/20 17-23 * * 0'  # Sunday afternoon slates
    - cron: '*/20 0-4 * * 1'    # Sunday night football
    - cron: '*/20 1-4 * * 2'    # Monday night football
    - cron: '*/20 1-4 * * 5'    # Thursday night football
    - cron: '*/20 18-23 * * 6'  # Saturday slates (late season)
    - cron: '*/20 0-3 * * 0'    # Saturday night games (late season)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh data, run simulations, rebuild site
        run: |
          python refresh.py
          cp site/index.html index.html
      - name: Commit and publish
        run: |
          git config user.name "record-book-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          # In-game runs: skip the commit when only the build timestamp moved
          # (no scores, odds or data actually changed), so quiet windows stay quiet.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 10 * * *" ]; then
            if [ "$(git diff --cached --name-only)" = "index.html" ]; then
              strip_ts() { sed -E 's/"built_ts": "[^"]*"/TS/; s/"built": "[^"]*"/B/'; }
              if diff <(git show HEAD:index.html | strip_ts) <(strip_ts < index.html) > /dev/null; then
                echo "only the build timestamp changed - skipping commit"; exit 0
              fi
            fi
            MSG="Live odds update $(date -u +%FT%H:%MZ)"
          else
            MSG="Daily auto-update $(date -u +%F)"
          fi
          git commit -m "$MSG"
          git pull --rebase
          git push
